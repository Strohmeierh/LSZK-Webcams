name: METAR LSZK aktualisieren

on:
  workflow_dispatch:
  
# Erlaubt nur ein gleichzeitiges Deployment und reiht weitere in eine Warteschlange ein
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-metar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ref: Stand des Branches beim START des Jobs (nicht beim Dispatch), damit ein
      # wartender Lauf sieht, was der vorherige gepusht hat
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: METAR LSZK herunterladen
        run: |
          # Mehrere Quellen versuchen
          STATUS=0

          # Quelle 1: aviationweather.gov - LSMD (Dübendorf, 8.6km von LSZK)
          # LSZK veröffentlicht kein eigenes METAR
          curl -s --max-time 15 \
            -A "Mozilla/5.0 (compatible; LSZK-Dashboard/1.0)" \
            -H "Accept: application/json" \
            -o metar-lszk.json \
            "https://aviationweather.gov/api/data/metar?ids=LSMD&format=json" || STATUS=$?

          # Prüfen ob Inhalt gültig (nicht leer, enthält LSMD)
          if [ -s metar-lszk.json ] && grep -q "LSMD" metar-lszk.json; then
            echo "Quelle 1 (aviationweather.gov/LSMD) erfolgreich"
          else
            echo "Quelle 1 fehlgeschlagen, versuche Quelle 2..."
            # Quelle 2: NOAA text METAR für LSMD
            RAW=$(curl -s --max-time 15 \
              "https://tgftp.nws.noaa.gov/data/observations/metar/stations/LSMD.TXT")
            if [ -n "$RAW" ] && echo "$RAW" | grep -q "LSMD"; then
              METAR=$(echo "$RAW" | tail -1)
              DATE=$(echo "$RAW" | head -1)
              echo "[{\"rawOb\":\"$METAR\",\"reportTime\":\"$DATE\"}]" > metar-lszk.json
              echo "Quelle 2 (NOAA text/LSMD) erfolgreich: $METAR"
            else
              echo "Beide Quellen fehlgeschlagen"
              exit 1
            fi
          fi

          echo "Finaler Inhalt:"
          cat metar-lszk.json

      # Föhn-Index = QNH Lugano-Agno (LSZA) minus QNH Zürich-Kloten (LSZH) aus den METAR
      # -> data/metar_foehn.json (Seite und KI-Briefing lesen beide diese Datei)
      - name: METAR LSZH und LSZA für den Föhn-Index
        continue-on-error: true
        run: python3 scripts/fetch_metar_foehn.py

      - name: Commit und Push
        run: |
          bash scripts/commit_and_push.sh "METAR LSZK: $(date -u '+%Y-%m-%d %H:%M') UTC" metar-lszk.json data/metar_foehn.json
