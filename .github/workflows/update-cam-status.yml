name: Update cam status

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cam-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # ref: the branch head when the job STARTS (not the commit from dispatch time), so a run
      # that waited in the queue sees what the previous run pushed (incl. data/ai_status.json)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Refresh cam status
        run: python scripts/update_cam_status.py

      # KI-Briefing (stündlich bei Tageslicht): erst den Versuch buchen und pushen, dann bezahlen.
      # Scheitert der Push, läuft der Claude-Aufruf nicht.
      - name: AI briefing - due?
        id: ai_check
        continue-on-error: true
        run: python scripts/ai_briefing.py --check >> "$GITHUB_OUTPUT"

      - name: AI briefing - reserve attempt
        id: ai_reserve
        if: steps.ai_check.outputs.due == 'true'
        continue-on-error: true
        run: python scripts/ai_briefing.py --reserve

      - name: Commit status files if changed
        run: |
          bash scripts/commit_and_push.sh "chore: update cam status [skip ci]" data/cam-status.json data/ai_status.json

      - name: AI briefing (Claude)
        if: steps.ai_reserve.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install --quiet --disable-pip-version-check anthropic==2.3.0
          python scripts/ai_briefing.py

      - name: Commit AI briefing
        if: steps.ai_reserve.outcome == 'success'
        run: |
          bash scripts/commit_and_push.sh "chore: AI briefing [skip ci]" data/ai_status.json
